name: Push Reminder Notifications

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

jobs:
  push-reminders:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger reminder push notifications
        run: |
          curl -X POST "${{ secrets.DASHBOARD_URL }}/api/push/reminders" \
            -H "Authorization: Bearer ${{ secrets.PUSH_CRON_SECRET }}"
